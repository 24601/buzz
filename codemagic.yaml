# Codemagic CI — iOS Simulator end-to-end run for the Flutter mobile app.
#
# Builds the app in `mobile/` for the iOS Simulator, boots a simulator, launches
# the app while screen-recording, drives it via its `buzz://` URL scheme, and
# publishes the video + screenshots as build artifacts. Also runs the Flutter
# unit/widget test suite. Trigger via the Codemagic REST API with
# workflowId "ios-simulator-e2e".
#
# Artifacts are written to `$CM_BUILD_DIR/artifacts` (the clone root) and the
# artifact globs below are resolved relative to the clone root, so they match
# regardless of each script's working directory.
workflows:
  ios-simulator-e2e:
    name: iOS Simulator E2E (video)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Toolchain versions
        script: |
          flutter --version
          xcodebuild -version
      - name: Flutter pub get
        script: cd "$CM_BUILD_DIR/mobile" && flutter pub get
      - name: Boot simulator, launch app (flutter run), record video, drive it
        script: |
          # NOTE: no `pipefail` — `... | head` triggers SIGPIPE upstream and
          # would abort under pipefail. Be defensive with `|| true` instead.
          set -u
          cd "$CM_BUILD_DIR/mobile"
          ART="$CM_BUILD_DIR/artifacts"
          mkdir -p "$ART"

          echo "== available simulators =="
          xcrun simctl list devices available || true

          # First UDID belonging to an iPhone device line.
          DEVICE=$(xcrun simctl list devices available \
            | grep -iE 'iPhone' \
            | grep -oiE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' \
            | head -n1)
          echo "DEVICE=[$DEVICE]"
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi

          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" || true

          # Launch the (debug) app the reliable way: `flutter run` wires up the
          # Dart VM service so the app actually renders. `simctl launch` alone
          # leaves a debug build on the springboard. Run it in the background and
          # wait until the VM service is up.
          flutter run -d "$DEVICE" --debug > "$ART/flutter-run.log" 2>&1 &
          RUN_PID=$!
          echo "flutter run pid=$RUN_PID; waiting for app to come up..."
          for i in $(seq 1 120); do
            if grep -qE "Dart VM Service|Flutter run key commands|Syncing files to device" "$ART/flutter-run.log"; then
              echo "app is up (marker after ${i}x2s)"; break
            fi
            if ! kill -0 "$RUN_PID" 2>/dev/null; then echo "flutter run exited early"; break; fi
            sleep 2
          done
          sleep 8

          # Record the running app, then drive it via its URL scheme.
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 "$ART/ios_app.mp4" &
          REC_PID=$!
          sleep 2
          xcrun simctl io "$DEVICE" screenshot "$ART/01_pairing_screen.png" || true
          xcrun simctl openurl "$DEVICE" "buzz://pair?demo=cloud-agent" || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot "$ART/02_after_deeplink.png" || true
          sleep 2

          # Finalize recording, then stop flutter run.
          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          kill "$RUN_PID" 2>/dev/null || true

          echo "== flutter run log (tail) =="; tail -n 40 "$ART/flutter-run.log" || true
          echo "== artifacts =="; ls -la "$ART" || true
          test -s "$ART/ios_app.mp4"
      - name: Flutter unit/widget tests
        script: |
          cd "$CM_BUILD_DIR/mobile"
          flutter test 2>&1 | tee "$CM_BUILD_DIR/artifacts/flutter-test.log"
    artifacts:
      - artifacts/*.mp4
      - artifacts/*.png
      - artifacts/*.log
